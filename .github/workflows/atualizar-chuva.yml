name: Atualizar chuva — Base Sudoeste
on:
  push:
    paths:
      - 'scripts/update_rain_sudoeste.py'
      - 'dados/chuva/municipios.json'
      - 'js/rain-map-ui.js'
      - 'dados/gcifs.json'
      - '.github/workflows/atualizar-chuva.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sudoeste-rain-update
  cancel-in-progress: true
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/update_rain_sudoeste.py
      - name: Publicar JSONs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/chuva/previsao.json dados/chuva/avisos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualiza chuva e avisos [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
